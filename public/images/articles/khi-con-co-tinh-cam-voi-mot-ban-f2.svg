<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 367" width="720" height="367" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="367" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="365.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Quan tâm hay kiểm soát?</text><text x="26.0" y="61.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8a88" text-anchor="start">Theo youth.gov và Pew, 2015</text><rect x="26.0" y="91.6" width="325.0" height="203.0" rx="12.0" fill="#1e8163" opacity="0.07"/><rect x="26.0" y="91.58" width="325.0" height="4" rx="2" fill="#1e8163"/><text x="42.0" y="123.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e8163" text-anchor="start">Mối quan hệ lành mạnh</text><circle cx="47.0" cy="145.1" r="3.2" fill="#1e8163"/><text x="58.0" y="149.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Tôn trọng ý kiến và giới hạn của nhau</text><circle cx="47.0" cy="176.1" r="3.2" fill="#1e8163"/><text x="58.0" y="180.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Tin nhau, không cần kiểm tra nhau</text><circle cx="47.0" cy="207.1" r="3.2" fill="#1e8163"/><text x="58.0" y="211.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Mỗi người vẫn có bạn bè, sở thích riêng</text><circle cx="47.0" cy="238.1" r="3.2" fill="#1e8163"/><text x="58.0" y="242.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Bất đồng thì nói chuyện, không xúc phạm</text><rect x="369.0" y="91.6" width="325.0" height="203.0" rx="12.0" fill="#b04c26" opacity="0.07"/><rect x="369.0" y="91.58" width="325.0" height="4" rx="2" fill="#b04c26"/><text x="385.0" y="123.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b04c26" text-anchor="start">Dấu hiệu đáng để ý</text><circle cx="390.0" cy="145.1" r="3.2" fill="#b04c26"/><text x="401.0" y="149.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Quyết định thay: mặc gì, chơi với ai</text><circle cx="390.0" cy="176.1" r="3.2" fill="#b04c26"/><text x="401.0" y="180.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Đòi mật khẩu, đọc tin nhắn, kiểm tra liên tục</text><circle cx="390.0" cy="207.1" r="3.2" fill="#b04c26"/><text x="401.0" y="211.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Ghen vô lý, tách khỏi bạn bè và gia đình</text><circle cx="390.0" cy="238.1" r="3.2" fill="#b04c26"/><text x="401.0" y="242.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Doạ dẫm — kể cả doạ làm điều dại dột nếu</text><text x="401.0" y="259.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">chia tay</text><text x="26.0" y="327.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Trong số teen Mỹ từng hẹn hò, 31% từng bị người yêu kiểm tra nhiều lần mỗi ngày và 13% từng bị đòi mật khẩu</text><text x="26.0" y="343.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">(Pew, 2015).</text></svg>