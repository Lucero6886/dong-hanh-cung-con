<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 319" width="720" height="319" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="319" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="317.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Câu hỏi đầu tiên hướng sự chú ý của con đi đâu?</text><rect x="26.0" y="71.6" width="325.0" height="191.0" rx="12.0" fill="#b04c26" opacity="0.07"/><rect x="26.0" y="71.58" width="325.0" height="4" rx="2" fill="#b04c26"/><text x="42.0" y="103.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b04c26" text-anchor="start">“Hôm nay con được mấy điểm?”</text><circle cx="47.0" cy="125.1" r="3.2" fill="#b04c26"/><text x="58.0" y="129.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Hướng chú ý RA NGOÀI, về phía kết quả do</text><text x="58.0" y="146.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">người khác chấm</text><circle cx="47.0" cy="175.1" r="3.2" fill="#b04c26"/><text x="58.0" y="179.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Tiện: có ngay một con số, so sánh được</text><circle cx="47.0" cy="206.1" r="3.2" fill="#b04c26"/><text x="58.0" y="210.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Có thể dần thành thước đo con dùng để đánh</text><text x="58.0" y="227.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">giá chính mình</text><rect x="369.0" y="71.6" width="325.0" height="191.0" rx="12.0" fill="#1e8163" opacity="0.07"/><rect x="369.0" y="71.58" width="325.0" height="4" rx="2" fill="#1e8163"/><text x="385.0" y="103.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e8163" text-anchor="start">“Hôm nay con học được gì?”</text><circle cx="390.0" cy="125.1" r="3.2" fill="#1e8163"/><text x="401.0" y="129.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Hướng chú ý VÀO TRONG, về thứ chính con</text><text x="401.0" y="146.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">vừa có thêm</text><circle cx="390.0" cy="175.1" r="3.2" fill="#1e8163"/><text x="401.0" y="179.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Khó hơn: câu trả lời đầu tiên thường là “con</text><text x="401.0" y="196.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">không biết”</text><circle cx="390.0" cy="225.1" r="3.2" fill="#1e8163"/><text x="401.0" y="229.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Là một kỹ năng, và kỹ năng thì cần tập</text><text x="26.0" y="295.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Vấn đề không phải là bỏ hẳn câu hỏi về điểm. Là THỨ TỰ: hỏi điều con học được trước, hỏi điểm sau.</text></svg>