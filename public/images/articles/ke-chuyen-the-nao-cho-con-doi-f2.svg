<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 317" width="720" height="317" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="317" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="315.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Bài học phải khớp với tình huống thật thì truyện mới có tác dụng</text><text x="26.0" y="61.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8a88" text-anchor="start">Rottman và cộng sự · Cognition, 2020</text><rect x="26.0" y="91.6" width="325.0" height="153.0" rx="12.0" fill="#b04c26" opacity="0.07"/><rect x="26.0" y="91.58" width="325.0" height="4" rx="2" fill="#b04c26"/><text x="42.0" y="123.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b04c26" text-anchor="start">Tình huống xa đời trẻ</text><circle cx="47.0" cy="145.1" r="3.2" fill="#b04c26"/><text x="58.0" y="149.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Truyện hải ly chia gỗ: 22,9% đổi theo</text><circle cx="47.0" cy="176.1" r="3.2" fill="#b04c26"/><text x="58.0" y="180.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Sách kiến thức, không có bài học: 21,9%</text><circle cx="47.0" cy="207.1" r="3.2" fill="#b04c26"/><text x="58.0" y="211.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Truyện có bài học không hơn sách không có</text><rect x="369.0" y="91.6" width="325.0" height="153.0" rx="12.0" fill="#1e8163" opacity="0.07"/><rect x="369.0" y="91.58" width="325.0" height="4" rx="2" fill="#1e8163"/><text x="385.0" y="123.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e8163" text-anchor="start">Tình huống giống đời trẻ</text><circle cx="390.0" cy="145.1" r="3.2" fill="#1e8163"/><text x="401.0" y="149.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Truyện trẻ chia bút trong lớp vẽ: 46,8%</text><circle cx="390.0" cy="176.1" r="3.2" fill="#1e8163"/><text x="401.0" y="180.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Sau 2–4 tuần còn tăng lên 58,8%</text><circle cx="390.0" cy="207.1" r="3.2" fill="#1e8163"/><text x="401.0" y="211.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Nói thẳng, không kể truyện: không kém hơn</text><text x="26.0" y="277.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Cách đo là tỷ lệ trẻ chuyển sang đúng nguyên tắc chia mà truyện khuyên, không phải tỷ lệ trẻ “xử sự công</text><text x="26.0" y="293.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">bằng”. Thứ quyết định là bài học có khớp đời trẻ hay không, không phải bản thân câu chuyện.</text></svg>