<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 374" width="720" height="374" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="374" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="372.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Bài học phải khớp với tình huống thật thì truyện mới có tác dụng</text><text x="26.0" y="61.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8a88" text-anchor="start">Rottman và cộng sự · Cognition, 2020</text><rect x="26.0" y="91.6" width="325.0" height="210.0" rx="12.0" fill="#b04c26" opacity="0.07"/><rect x="26.0" y="91.58" width="325.0" height="4" rx="2" fill="#b04c26"/><text x="42.0" y="123.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b04c26" text-anchor="start">Tình huống xa đời trẻ</text><circle cx="47.0" cy="145.1" r="3.2" fill="#b04c26"/><text x="58.0" y="149.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Truyện hải ly chia gỗ: 22,9% xử sự công</text><text x="58.0" y="166.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">bằng</text><circle cx="47.0" cy="195.1" r="3.2" fill="#b04c26"/><text x="58.0" y="199.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Sách kiến thức về hải ly, không có bài học:</text><text x="58.0" y="216.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">21,9%</text><circle cx="47.0" cy="245.1" r="3.2" fill="#b04c26"/><text x="58.0" y="249.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Truyện có bài học không hơn sách không có</text><text x="58.0" y="266.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">bài học</text><rect x="369.0" y="91.6" width="325.0" height="210.0" rx="12.0" fill="#1e8163" opacity="0.07"/><rect x="369.0" y="91.58" width="325.0" height="4" rx="2" fill="#1e8163"/><text x="385.0" y="123.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e8163" text-anchor="start">Tình huống giống đời trẻ</text><circle cx="390.0" cy="145.1" r="3.2" fill="#1e8163"/><text x="401.0" y="149.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Truyện một đứa trẻ chia bút trong lớp vẽ:</text><text x="401.0" y="166.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">46,8%</text><circle cx="390.0" cy="195.1" r="3.2" fill="#1e8163"/><text x="401.0" y="199.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Sau 2–4 tuần còn tăng tiếp lên 58,8%</text><circle cx="390.0" cy="226.1" r="3.2" fill="#1e8163"/><text x="401.0" y="230.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Nói thẳng bài học, bỏ hẳn truyện đi: 67,3%</text><text x="26.0" y="334.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Chính nhóm tác giả kết luận rằng trẻ hiểu được truyện nhưng không bắc cầu được sang đời mình — thứ quyết định</text><text x="26.0" y="350.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">là bài học, không phải bản thân câu chuyện.</text></svg>