<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="290" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="288.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Giấc ngủ tuổi teen: khuyến nghị và thực tế</text><text x="26.0" y="61.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8a88" text-anchor="start">Viện Y học Giấc ngủ Hoa Kỳ · lịch học phổ biến ở Việt Nam</text><line x1="276" y1="83.58" x2="276" y2="221.57999999999998" stroke="#eae4d8" stroke-width="1.5"/><path d="M278.0,95.6 H481.9 Q485.9,95.6 485.9,99.6 V117.6 Q485.9,121.6 481.9,121.6 H278.0 Z" fill="#c9c3b7"/><text x="264.0" y="104.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Mức sàn khuyến nghị, tuổi</text><text x="264.0" y="123.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">13–18</text><text x="493.9" y="113.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">8 tiếng (khuyến nghị 8 – 10)</text><path d="M278.0,141.6 H442.9 Q446.9,141.6 446.9,145.6 V163.6 Q446.9,167.6 442.9,167.6 H278.0 Z" fill="#c9c3b7"/><text x="264.0" y="150.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Một đứa trẻ đi ngủ 11h30, dậy</text><text x="264.0" y="169.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">6h</text><text x="454.9" y="159.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">6,5 tiếng</text><path d="M278.0,187.6 H313.0 Q317.0,187.6 317.0,191.6 V209.6 Q317.0,213.6 313.0,213.6 H278.0 Z" fill="#b04c26"/><text x="264.0" y="206.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1d2b2a" text-anchor="end">Thiếu so với mức sàn</text><text x="325.0" y="205.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">khoảng 1,5 tiếng</text><text x="26.0" y="250.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Khi bước vào dậy thì, đồng hồ sinh học của trẻ lùi lại tới hai tiếng — đo được bằng nồng độ melatonin trong phòng</text><text x="26.0" y="266.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">thí nghiệm. Trẻ 15 tuổi được bảo ngủ lúc 10 giờ thường thật sự chưa buồn ngủ.</text></svg>