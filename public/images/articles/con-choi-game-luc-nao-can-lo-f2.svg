<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="336" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="334.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Đo càng chặt, tỷ lệ rối loạn chơi game càng thấp</text><text x="26.0" y="61.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8a88" text-anchor="start">Hai phân tích gộp toàn cầu · mọi lứa tuổi, không riêng trẻ em</text><line x1="326" y1="83.58" x2="326" y2="267.58" stroke="#eae4d8" stroke-width="1.5"/><path d="M328.0,95.6 H633.9 Q637.9,95.6 637.9,99.6 V117.6 Q637.9,121.6 633.9,121.6 H328.0 Z" fill="#c9c3b7"/><text x="314.0" y="114.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Gộp 61 nghiên cứu, 29 nước</text><text x="645.9" y="113.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">3,3%</text><path d="M328.0,141.6 H610.4 Q614.4,141.6 614.4,145.6 V163.6 Q614.4,167.6 610.4,167.6 H328.0 Z" fill="#c9c3b7"/><text x="314.0" y="160.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Gộp 53 nghiên cứu, 17 nước</text><text x="622.4" y="159.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">3,05%</text><path d="M328.0,187.6 H549.4 Q553.4,187.6 553.4,191.6 V209.6 Q553.4,213.6 549.4,213.6 H328.0 Z" fill="#c9c3b7"/><text x="314.0" y="206.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Chỉ tính các mẫu đại diện</text><text x="561.4" y="205.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">2,4%</text><path d="M328.0,233.6 H455.5 Q459.5,233.6 459.5,237.6 V255.6 Q459.5,259.6 455.5,259.6 H328.0 Z" fill="#1e8163"/><text x="314.0" y="252.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1d2b2a" text-anchor="end">Sau khi hiệu chỉnh thiên lệch công bố</text><text x="467.5" y="251.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">1,4%</text><text x="26.0" y="296.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Hai cột dưới cùng thuộc phân tích 61 nghiên cứu. Ở các mẫu toàn teen, tỷ lệ thường cao hơn. Riêng việc dùng</text><text x="26.0" y="312.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">bảng hỏi nào đã chiếm 77% sự chênh lệch giữa các nghiên cứu.</text></svg>