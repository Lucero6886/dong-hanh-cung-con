<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="720" height="332" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="332" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="330.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Khen mô tả việc, đừng khen phong danh hiệu</text><rect x="26.0" y="71.6" width="325.0" height="172.0" rx="12.0" fill="#b04c26" opacity="0.07"/><rect x="26.0" y="71.58" width="325.0" height="4" rx="2" fill="#b04c26"/><text x="42.0" y="103.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b04c26" text-anchor="start">Đặt lên vai con một danh hiệu</text><circle cx="47.0" cy="125.1" r="3.2" fill="#b04c26"/><text x="58.0" y="129.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">“Con thông minh thật.”</text><circle cx="47.0" cy="156.1" r="3.2" fill="#b04c26"/><text x="58.0" y="160.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">“Con là đứa ngoan.”</text><circle cx="47.0" cy="187.1" r="3.2" fill="#b04c26"/><text x="58.0" y="191.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">“Con học giỏi lắm.”</text><rect x="369.0" y="71.6" width="325.0" height="172.0" rx="12.0" fill="#1e8163" opacity="0.07"/><rect x="369.0" y="71.58" width="325.0" height="4" rx="2" fill="#1e8163"/><text x="385.0" y="103.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e8163" text-anchor="start">Mô tả điều con vừa làm</text><circle cx="390.0" cy="125.1" r="3.2" fill="#1e8163"/><text x="401.0" y="129.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">“Chỗ đó khó mà con tìm ra cách.”</text><circle cx="390.0" cy="156.1" r="3.2" fill="#1e8163"/><text x="401.0" y="160.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">“Con vừa tự dọn bàn. Bố thấy.”</text><circle cx="390.0" cy="187.1" r="3.2" fill="#1e8163"/><text x="401.0" y="191.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">“Con ngồi được đúng hai mươi phút không</text><text x="401.0" y="208.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">đứng dậy.”</text><text x="26.0" y="276.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Trong nghiên cứu kinh điển, 38% trẻ được khen thông minh đã khai man điểm số; ở nhóm được khen chăm chỉ là</text><text x="26.0" y="292.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">13%, và ở nhóm không được khen gì là 14%. Tức là khen thông minh làm tăng, chứ không phải khen chăm chỉ làm</text><text x="26.0" y="308.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">giảm.</text></svg>