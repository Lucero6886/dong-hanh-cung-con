<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 335" width="720" height="335" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="335" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="333.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Thai giáo: phần khoa học có thật và phần bị thổi phồng</text><rect x="26.0" y="71.6" width="325.0" height="191.0" rx="12.0" fill="#1e8163" opacity="0.07"/><rect x="26.0" y="71.58" width="325.0" height="4" rx="2" fill="#1e8163"/><text x="42.0" y="103.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e8163" text-anchor="start">Có thật</text><circle cx="47.0" cy="125.1" r="3.2" fill="#1e8163"/><text x="58.0" y="129.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Thai nhi nghe được từ khoảng tuần 26–28</text><circle cx="47.0" cy="156.1" r="3.2" fill="#1e8163"/><text x="58.0" y="160.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Trẻ sơ sinh nhận ra giọng mẹ và nhịp điệu</text><text x="58.0" y="177.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">tiếng mẹ đẻ</text><circle cx="47.0" cy="206.1" r="3.2" fill="#1e8163"/><text x="58.0" y="210.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Tử cung lọc bớt âm cao — thứ đi qua chủ yếu</text><text x="58.0" y="227.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">là nhịp điệu</text><rect x="369.0" y="71.6" width="325.0" height="191.0" rx="12.0" fill="#b04c26" opacity="0.07"/><rect x="369.0" y="71.58" width="325.0" height="4" rx="2" fill="#b04c26"/><text x="385.0" y="103.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b04c26" text-anchor="start">Bị thổi phồng</text><circle cx="390.0" cy="125.1" r="3.2" fill="#b04c26"/><text x="401.0" y="129.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">“Nghe Mozart giúp con thông minh hơn”</text><circle cx="390.0" cy="156.1" r="3.2" fill="#b04c26"/><text x="401.0" y="160.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Tai nghe áp lên bụng bầu — có khuyến cáo</text><text x="401.0" y="177.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">KHÔNG nên</text><circle cx="390.0" cy="206.1" r="3.2" fill="#b04c26"/><text x="401.0" y="210.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">DHA làm con thông minh hơn — bằng chứng</text><text x="401.0" y="227.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">rất yếu</text><text x="26.0" y="295.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Giọng của chính bạn truyền nhịp điệu tốt hơn bất kỳ cái loa nào, và miễn phí. Bản tổng quan 2023 khuyến cáo</text><text x="26.0" y="311.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">không áp tai nghe hay loa trực tiếp lên bụng bầu.</text></svg>