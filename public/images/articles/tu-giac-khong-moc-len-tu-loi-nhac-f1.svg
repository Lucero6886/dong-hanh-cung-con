<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 338" width="720" height="338" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="338" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="336.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Phần thưởng tác động thế nào tới hứng thú tự nhiên</text><text x="26.0" y="61.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8a88" text-anchor="start">Phân tích gộp 128 nghiên cứu · Psychological Bulletin, 1999</text><line x1="399.9" y1="83.58" x2="399.9" y2="229.57999999999998" stroke="#4a5a58" stroke-width="1.5"/><text x="399.9" y="245.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8a88" text-anchor="middle">0</text><path d="M344.5,96.6 H398.4 V122.6 H344.5 Q340.5,122.6 340.5,118.6 V100.6 Q340.5,96.6 344.5,96.6 Z" fill="#b04c26"/><text x="304.0" y="115.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Thưởng vật chất, đã hứa trước</text><text x="694.0" y="114.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="end">-0,36</text><path d="M401.4,144.6 H402.2 Q403.0,144.6 403.0,145.4 V169.8 Q403.0,170.6 402.2,170.6 H401.4 Z" fill="#1e8163"/><text x="304.0" y="163.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Thưởng bất ngờ, không hứa trước</text><text x="694.0" y="162.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="end">0,01</text><path d="M401.4,192.6 H415.1 Q419.1,192.6 419.1,196.6 V214.6 Q419.1,218.6 415.1,218.6 H401.4 Z" fill="#1e8163"/><text x="304.0" y="211.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Lời khen — số riêng cho trẻ em</text><text x="694.0" y="210.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="end">+0,11 · không có ý nghĩa TK</text><text x="26.0" y="282.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Số càng âm thì hứng thú tự nhiên càng giảm. Lưu ý dòng thứ ba: con số +0,33 hay được trích cho lời khen là mức</text><text x="26.0" y="298.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">gộp mọi lứa tuổi. Tách theo tuổi thì sinh viên đại học là +0,43, còn ở trẻ em chỉ +0,11 và không đạt ý nghĩa thống</text><text x="26.0" y="314.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">kê.</text></svg>