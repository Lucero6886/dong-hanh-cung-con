<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 328" width="720" height="328" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="328" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="326.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Chuyện của riêng con, và chuyện cần cho bố mẹ biết</text><rect x="26.0" y="71.6" width="325.0" height="184.0" rx="12.0" fill="#3f6bbf" opacity="0.07"/><rect x="26.0" y="71.58" width="325.0" height="4" rx="2" fill="#3f6bbf"/><text x="42.0" y="103.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#3f6bbf" text-anchor="start">Chuyện của riêng con</text><circle cx="47.0" cy="125.1" r="3.2" fill="#3f6bbf"/><text x="58.0" y="129.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Nhắn gì với bạn thân</text><circle cx="47.0" cy="156.1" r="3.2" fill="#3f6bbf"/><text x="58.0" y="160.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Thích nghe nhạc gì, xem phim gì</text><circle cx="47.0" cy="187.1" r="3.2" fill="#3f6bbf"/><text x="58.0" y="191.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Mặc gì, để tóc thế nào</text><circle cx="47.0" cy="218.1" r="3.2" fill="#3f6bbf"/><text x="58.0" y="222.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Viết gì trong nhật ký</text><rect x="369.0" y="71.6" width="325.0" height="184.0" rx="12.0" fill="#1e8163" opacity="0.07"/><rect x="369.0" y="71.58" width="325.0" height="4" rx="2" fill="#1e8163"/><text x="385.0" y="103.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e8163" text-anchor="start">Chuyện cần cho bố mẹ biết</text><circle cx="390.0" cy="125.1" r="3.2" fill="#1e8163"/><text x="401.0" y="129.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Đang ở đâu khi trời đã tối</text><circle cx="390.0" cy="156.1" r="3.2" fill="#1e8163"/><text x="401.0" y="160.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Đi với ai khi đi xa nhà</text><circle cx="390.0" cy="187.1" r="3.2" fill="#1e8163"/><text x="401.0" y="191.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Có ai làm con sợ hay ép con làm gì không</text><circle cx="390.0" cy="218.1" r="3.2" fill="#1e8163"/><text x="401.0" y="222.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Chuyện ảnh hưởng tới sức khoẻ, an toàn</text><text x="26.0" y="288.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Chính teen cũng thấy mình có nghĩa vụ kể nhiều nhất về chuyện an toàn. Các ví dụ ở đây chỉ để minh hoạ — ranh</text><text x="26.0" y="304.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">giới nên được bàn với con.</text></svg>