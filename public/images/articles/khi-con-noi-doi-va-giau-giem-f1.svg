<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="336" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="334.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Teen kể với mẹ đến đâu?</text><text x="26.0" y="61.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8a88" text-anchor="start">108 học sinh Mỹ lớp 7 và lớp 10 · Rote và cộng sự, 2012</text><line x1="316" y1="83.58" x2="316" y2="267.58" stroke="#eae4d8" stroke-width="1.5"/><path d="M318.0,95.6 H592.9 Q596.9,95.6 596.9,99.6 V117.6 Q596.9,121.6 592.9,121.6 H318.0 Z" fill="#c9c3b7"/><text x="304.0" y="114.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Kể hết</text><text x="604.9" y="113.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">31%</text><path d="M318.0,141.6 H520.9 Q524.9,141.6 524.9,145.6 V163.6 Q524.9,167.6 520.9,167.6 H318.0 Z" fill="#c9c3b7"/><text x="304.0" y="160.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Kể nhưng bỏ bớt chi tiết quan trọng</text><text x="532.9" y="159.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">23%</text><path d="M318.0,187.6 H646.9 Q650.9,187.6 650.9,191.6 V209.6 Q650.9,213.6 646.9,213.6 H318.0 Z" fill="#1e8163"/><text x="304.0" y="206.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1d2b2a" text-anchor="end">Né, không nhắc tới</text><text x="658.9" y="205.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">37%</text><path d="M318.0,233.6 H404.0 Q408.0,233.6 408.0,237.6 V255.6 Q408.0,259.6 404.0,259.6 H318.0 Z" fill="#c9c3b7"/><text x="304.0" y="252.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Nói dối</text><text x="416.0" y="251.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">10%</text><text x="26.0" y="296.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Số liệu cho loại chuyện con coi là của riêng mình nhưng cha mẹ coi là chuyện an toàn hay nề nếp — như đi chơi</text><text x="26.0" y="312.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">với ai, ở đâu. Ở cả ba loại chuyện được hỏi, nói dối luôn là cách ít dùng nhất (4–10%).</text></svg>