<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" width="720" height="316" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="316" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="314.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Hậu quả có liên quan tới việc con làm, hay không?</text><rect x="26.0" y="71.6" width="325.0" height="172.0" rx="12.0" fill="#b04c26" opacity="0.07"/><rect x="26.0" y="71.58" width="325.0" height="4" rx="2" fill="#b04c26"/><text x="42.0" y="103.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b04c26" text-anchor="start">Ít tác dụng — không liên quan</text><circle cx="47.0" cy="125.1" r="3.2" fill="#b04c26"/><text x="58.0" y="129.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Làm bẩn nhà → cấm xem tivi</text><circle cx="47.0" cy="156.1" r="3.2" fill="#b04c26"/><text x="58.0" y="160.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Quên bài tập → mắng</text><circle cx="47.0" cy="187.1" r="3.2" fill="#b04c26"/><text x="58.0" y="191.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Dùng điện thoại quá giờ → tịch thu một tuần</text><rect x="369.0" y="71.6" width="325.0" height="172.0" rx="12.0" fill="#1e8163" opacity="0.07"/><rect x="369.0" y="71.58" width="325.0" height="4" rx="2" fill="#1e8163"/><text x="385.0" y="103.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e8163" text-anchor="start">Có liên quan — dạy được điều gì đó</text><circle cx="390.0" cy="125.1" r="3.2" fill="#1e8163"/><text x="401.0" y="129.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Làm bẩn nhà → cùng lau dọn</text><circle cx="390.0" cy="156.1" r="3.2" fill="#1e8163"/><text x="401.0" y="160.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Quên bài tập → tự viết lời xin lỗi cô</text><circle cx="390.0" cy="187.1" r="3.2" fill="#1e8163"/><text x="401.0" y="191.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Quá giờ → hôm sau bớt đúng phần đã dùng</text><text x="401.0" y="208.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">quá</text><text x="26.0" y="276.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Cột phải mất công hơn, và với người bận rộn đó là một cái giá thật. Nhiều cha mẹ thấy cột phải nhẹ dần theo thời</text><text x="26.0" y="292.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">gian, còn cột trái thì cứ phải làm lại.</text></svg>