, Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">53%</text><path d="M138.0,187.6 H646.9 Q650.9,187.6 650.9,191.6 V209.6 Q650.9,213.6 646.9,213.6 H138.0 Z" fill="#3f6bbf"/><text x="124.0" y="206.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">17 tuổi</text><text x="658.9" y="205.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">70%</text><text x="26.0" y="250.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Số liệu Mỹ và đã khá cũ — chỉ để thấy xu hướng tăng theo tuổi, không phải để so với con bạn. Không có người</text><text x="26.0" y="266.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">yêu ở tuổi này cũng hoàn toàn bình thường.</text></svg>