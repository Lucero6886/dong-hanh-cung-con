<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" width="720" height="366" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="366" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="364.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Chơi nhiều chưa phải là rối loạn chơi game</text><rect x="26.0" y="71.6" width="325.0" height="222.0" rx="12.0" fill="#1e8163" opacity="0.07"/><rect x="26.0" y="71.58" width="325.0" height="4" rx="2" fill="#1e8163"/><text x="42.0" y="103.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e8163" text-anchor="start">Chơi nhiều</text><circle cx="47.0" cy="125.1" r="3.2" fill="#1e8163"/><text x="58.0" y="129.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Chơi lâu nhưng vẫn ngủ đủ, ăn uống đều</text><circle cx="47.0" cy="156.1" r="3.2" fill="#1e8163"/><text x="58.0" y="160.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Vẫn đi học, làm bài, gặp bạn ngoài đời</text><circle cx="47.0" cy="187.1" r="3.2" fill="#1e8163"/><text x="58.0" y="191.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Bảo dừng thì khó chịu — nhưng dừng được</text><circle cx="47.0" cy="218.1" r="3.2" fill="#1e8163"/><text x="58.0" y="222.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Vẫn còn những niềm vui khác ngoài game</text><rect x="369.0" y="71.6" width="325.0" height="222.0" rx="12.0" fill="#b04c26" opacity="0.07"/><rect x="369.0" y="71.58" width="325.0" height="4" rx="2" fill="#b04c26"/><text x="385.0" y="103.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b04c26" text-anchor="start">Rối loạn chơi game theo WHO</text><circle cx="390.0" cy="125.1" r="3.2" fill="#b04c26"/><text x="401.0" y="129.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Muốn dừng mà không dừng được</text><circle cx="390.0" cy="156.1" r="3.2" fill="#b04c26"/><text x="401.0" y="160.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Game lấn dần các việc và niềm vui khác</text><circle cx="390.0" cy="187.1" r="3.2" fill="#b04c26"/><text x="401.0" y="191.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Vẫn chơi, thậm chí nhiều hơn, dù thấy hậu</text><text x="401.0" y="208.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">quả</text><circle cx="390.0" cy="237.1" r="3.2" fill="#b04c26"/><text x="401.0" y="241.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">Ảnh hưởng rõ tới học tập, gia đình — thường</text><text x="401.0" y="258.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">kéo dài cả năm</text><text x="26.0" y="326.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Định nghĩa của WHO không có ngưỡng số giờ chơi nào. Điều đáng canh là game đang lấn vào chỗ của cái gì: giấc</text><text x="26.0" y="342.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">ngủ, bài vở, bữa cơm, bạn bè.</text></svg>