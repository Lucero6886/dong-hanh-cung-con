<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="244" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="242.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Thứ tự xử lý khi cả hai cùng đang nóng</text><rect x="26.0" y="71.6" width="202.7" height="100.0" rx="11.0" fill="#1e8163" opacity="0.08"/><text x="40.0" y="97.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e8163" text-anchor="start">1. Mình trước</text><text x="40.0" y="121.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">hạ nhịp của chính mình —</text><text x="40.0" y="138.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">nói ra thành lời rằng mình</text><text x="40.0" y="154.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">đang bực</text><path d="M235.7,121.6 H249.7 M244.7,116.6 l5,5 l-5,5" fill="none" stroke="#7d8a88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="258.7" y="71.6" width="202.7" height="100.0" rx="11.0" fill="#1e8163" opacity="0.08"/><text x="272.7" y="97.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e8163" text-anchor="start">2. Rồi tới con</text><text x="272.7" y="121.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">gọi tên cảm xúc, không</text><text x="272.7" y="138.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">giảng giải, không hỏi lý do</text><path d="M468.3,121.6 H482.3 M477.3,116.6 l5,5 l-5,5" fill="none" stroke="#7d8a88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="491.3" y="71.6" width="202.7" height="100.0" rx="11.0" fill="#1e8163" opacity="0.08"/><text x="505.3" y="97.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e8163" text-anchor="start">3. Nói chuyện sau</text><text x="505.3" y="121.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">khi cả hai đã nguội, quay</text><text x="505.3" y="138.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5a58" text-anchor="start">lại đúng chuyện đó</text><text x="26.0" y="204.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">Khi cả hai đang nóng, lời giảng giải thường không vào được — với người lớn cũng vậy, không riêng gì trẻ. Hoãn lại</text><text x="26.0" y="220.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">không làm mất uy, nhưng phải nhớ quay lại thật.</text></svg>