<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="244" rx="14" fill="#faf8f3"/><rect x="0.75" y="0.75" width="718.5" height="242.5" rx="13.25" fill="none" stroke="#e6e0d4" stroke-width="1.5"/><text x="26.0" y="41.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2b2a" text-anchor="start">Hai con số trong cùng một cuộc điều tra</text><text x="26.0" y="61.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8a88" text-anchor="start">V-NAMHS · 5.996 gia đình, con 10–17 tuổi, cuối năm 2021</text><line x1="366" y1="83.58" x2="366" y2="175.57999999999998" stroke="#eae4d8" stroke-width="1.5"/><path d="M368.0,95.6 H633.9 Q637.9,95.6 637.9,99.6 V117.6 Q637.9,121.6 633.9,121.6 H368.0 Z" fill="#3f6bbf"/><text x="354.0" y="114.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Vị thành niên có vấn đề sức khoẻ tâm thần</text><text x="645.9" y="113.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">21,7%</text><path d="M368.0,141.6 H427.4 Q431.4,141.6 431.4,145.6 V163.6 Q431.4,167.6 427.4,167.6 H368.0 Z" fill="#3f6bbf"/><text x="354.0" y="160.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1d2b2a" text-anchor="end">Cha mẹ cho rằng con cần được giúp</text><text x="439.4" y="159.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4a5a58" text-anchor="start">5,1%</text><text x="26.0" y="204.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">“Có vấn đề” là có ít nhất một nửa số triệu chứng của một rối loạn — chưa phải mắc rối loạn (3,3%). Lo âu là vấn</text><text x="26.0" y="220.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8a88" text-anchor="start">đề hay gặp nhất.</text></svg>