<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
<meta name="description" content="Tài liệu giúp hiểu bản chất hệ thống website Đồng hành cùng con, nắm được các thay đổi, và luôn làm chủ dự án.">
<style>
:root{
  --paper:#fbfaf6; --surface:#fff; --surface-2:#f4f1ea;
  --ink:#1d2b2a; --ink-2:#3c4c4a; --ink-muted:#5b6b69;
  --line:#e4dfd3; --line-strong:#cec7b7;
  --brand:#2e6f60; --brand-ink:#1e5348; --brand-soft:#e8f1ee;
  --accent:#b0603a; --accent-ink:#8f4b2b; --accent-soft:#fbeee4;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#101618; --surface:#16201f; --surface-2:#1d2827;
    --ink:#e9efec; --ink-2:#c6d2cf; --ink-muted:#97a8a5;
    --line:#2a3837; --line-strong:#3b4d4b;
    --brand:#6cbca7; --brand-ink:#8ed4bf; --brand-soft:#16302b;
    --accent:#dd9161; --accent-ink:#e8a97f; --accent-soft:#2f2118;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);
  font-size:17px;line-height:1.72;overflow-wrap:break-word;
}
.masthead{
  background:linear-gradient(160deg,var(--brand-soft),transparent 70%);
  border-bottom:1px solid var(--line);padding:44px 0 34px;
}
.wrap{width:min(100% - 2.2rem,1180px);margin-inline:auto}
.badge{
  display:inline-block;font-size:12px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--brand-ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:999px;padding:5px 12px;margin-bottom:14px;
}
.masthead h1{font-size:clamp(30px,5vw,46px);line-height:1.12;letter-spacing:-.03em;margin:0 0 10px}
.masthead p{margin:0;color:var(--ink-2);font-size:clamp(16px,2vw,19px);max-width:60ch}
.meta{margin-top:16px;font-size:14px;color:var(--ink-muted)}
.meta code{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 6px}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:34px;padding:36px 0 80px}
@media (min-width:1024px){.layout{grid-template-columns:262px minmax(0,1fr);gap:52px}}

nav#TOC{font-size:14px;order:-1}
@media (min-width:1024px){
  nav#TOC{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;
    border-right:1px solid var(--line);padding-right:20px}
}
@media (max-width:1023px){
  nav#TOC{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
}
nav#TOC::before{
  content:"Mục lục";display:block;font-size:12px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px;
}
nav#TOC ul{list-style:none;margin:0;padding:0}
nav#TOC ul ul{padding-left:12px}
nav#TOC li{margin:1px 0}
nav#TOC a{display:block;padding:5px 0;color:var(--ink-muted);text-decoration:none;line-height:1.4}
nav#TOC a:hover{color:var(--brand-ink)}

main{min-width:0;max-width:50rem}
main > h1:first-child{
  font-size:clamp(26px,4vw,34px);letter-spacing:-.02em;margin:0 0 18px;
  padding-bottom:14px;border-bottom:1px solid var(--line);
}
h2{
  font-size:clamp(21px,3vw,27px);line-height:1.25;letter-spacing:-.02em;
  margin:52px 0 14px;padding-top:22px;border-top:1px solid var(--line);scroll-margin-top:20px;
}
h3{font-size:19px;line-height:1.3;margin:34px 0 10px;color:var(--brand-ink);scroll-margin-top:20px}
h4{font-size:16px;margin:22px 0 8px;scroll-margin-top:20px}
p{margin:0 0 16px}
a{color:var(--brand-ink);text-underline-offset:.18em}
a:hover{color:var(--accent-ink)}
strong{color:var(--ink);font-weight:700}
ul,ol{padding-left:1.35em;margin:0 0 16px}
li{margin:.34em 0}
hr{border:0;border-top:1px solid var(--line);margin:44px 0}

blockquote{
  margin:26px 0;padding:16px 20px;border-left:4px solid var(--brand);
  background:var(--brand-soft);border-radius:0 12px 12px 0;color:var(--ink-2);
}
blockquote > :first-child{margin-top:0}
blockquote > :last-child{margin-bottom:0}
blockquote strong{color:var(--brand-ink)}

code{font-family:var(--mono);font-size:.88em}
:not(pre) > code{
  background:var(--surface-2);border:1px solid var(--line);border-radius:5px;
  padding:.1em .38em;color:var(--accent-ink);
}
pre{
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.62;margin:0 0 18px;
}
pre code{color:var(--ink-2);background:none;border:0;padding:0;font-size:inherit}

table{
  width:100%;border-collapse:collapse;font-size:15px;margin:0 0 20px;
  display:block;overflow-x:auto;
}
th,td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:700;white-space:nowrap}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}

/* Ô đánh dấu trong danh sách kiểm tra */
input[type=checkbox]{margin-right:.5em;accent-color:var(--brand)}
ul:has(> li > input[type=checkbox]){list-style:none;padding-left:.2em}

/* Ô đánh dấu việc đang chờ ở Phần A cho nổi hơn */
main ul:has(> li > input[type=checkbox]) > li{
  background:var(--accent-soft);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;margin:8px 0;list-style:none;
}

small{font-size:13.5px;color:var(--ink-muted)}
footer.doc-foot{border-top:1px solid var(--line);margin-top:56px;padding-top:20px;font-size:13.5px;color:var(--ink-muted)}

@media print{
  nav#TOC{display:none}
  .layout{display:block;padding-top:0}
  .masthead{background:none;padding:0 0 18px}
  body{font-size:10.5pt;background:#fff;color:#000}
  h2{break-after:avoid}
  pre,table,blockquote{break-inside:avoid}
  a{color:#000}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <span class="badge">Sổ tay vận hành · v$version$</span>
    <h1>$title$</h1>
    <p>$subtitle$</p>
    <p class="meta">Dự án <code>dong-hanh-cung-con</code> · Cập nhật $date$ · Bản gốc: <code>implementation-notes.md</code></p>
  </div>
</header>

<div class="wrap layout">
$if(toc)$
<nav id="TOC" role="doc-toc" aria-label="Mục lục tài liệu">
$table-of-contents$
</nav>
$endif$
  <main>
$body$
    <footer class="doc-foot">
      Sổ tay này được tạo từ <code>implementation-notes.md</code>. Claude cập nhật file <code>.md</code> sau mỗi thay đổi rồi tạo lại bản HTML này.
    </footer>
  </main>
</div>

</body>
</html>
